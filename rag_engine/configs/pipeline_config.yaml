pipeline_name: "enterprise_rag_engine"

document_store:
  provider: "postgres_store"
  params:
    dsn: "postgresql://postgres:postgres@localhost:5433/rag_db"

ingestion:
  supported_formats: [".pdf", ".md", ".json", ".txt"]
  normalizers:
    - name: "unicode_whitespace_cleaner"
      params:
        preserve_paragraphs: true
    - name: "regex_noise_cleaner"
      params:
        patterns_to_remove:
          - 'RAG Systems Evaluation Framework\s*Page \d+ of \d+'
    - name: "regex_pii_redactor"
      params:
        replacement_token: "[REDACTED]"
    - name: "arabic_text_normalizer"
      params:
        remove_diacritics: true
        remove_tatweel: true
        unify_alef: true
        unify_yeh: true
    - name: "dictionary_abbreviation_expander"
      params:
        custom_abbreviations:
          "CXR": "Chest X-ray"
          "PE": "Pleural Effusion"
  chunker:
    name: "markdown_section_chunker"
    params:
      chunk_size: 512
      chunk_overlap: 64

retrieval:
  abstention_threshold: 0.2
  embedder:
    name: "fastembed_embedder"
    params:
      model_name: "BAAI/bge-small-en-v1.5"
      dim: 384
  vector_store:
    provider: "pgvector_store"
    params:
      dsn: "postgresql://postgres:postgres@localhost:5433/rag_db"
      dimension: 384
      rrf_k: 60
  reranker:
    name: "hybrid_overlap_reranker"
    params:
      semantic_weight: 0.45
      lexical_weight: 0.55

generation:
  name: "groq_generator"
  params:
    model_name: "allam-2-7b"
    temperature: 0.1
    max_tokens: 1024
